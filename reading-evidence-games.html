<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Evidence Arcade</title><style>:root{font-family:system-ui,Arial;color:#202b49;background:#f6f3ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#38236e,#277d9e);color:white;padding:25px max(18px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:auto;padding:20px}h1{margin:5px 0}button,select,textarea{font:inherit}button{background:#6240b7;color:white;border:0;border-radius:10px;padding:11px 15px;cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid orange}button.secondary{background:#e9e2fa;color:#30224f}.panel{background:white;border:1px solid #ded8ec;border-radius:16px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{text-align:left;background:white;border:2px solid #e3daf6;color:#253150;min-height:125px}.card:hover{border-color:#6240b7}.muted{color:#59657c}.hidden{display:none}.passage{line-height:1.85;background:#f3f7fc;border-left:5px solid #2799a7;padding:15px;border-radius:9px}.sentence{display:block;padding:5px;border-radius:5px}.sentence button{background:transparent;color:#223457;padding:4px;text-align:left;width:100%;border:1px solid transparent}.sentence button:hover,.sentence button.selected{background:#e4d9fc;border-color:#7651c8}.options{display:grid;gap:9px;margin:14px 0}.options button{text-align:left;background:#f1ebfb;color:#29204c;border:2px solid transparent}.options button.selected{border-color:#6240b7;background:#e0d2ff}.feedback{padding:12px;background:#f1ebfb;border-radius:10px;margin:12px 0;min-height:45px}textarea{width:100%;min-height:100px;border:1px solid #aaa;border-radius:9px;padding:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar>*{max-width:100%}label{font-weight:700}select{padding:10px;border-radius:8px}small{color:#58647a}</style></head><body><header><h1>📚 Reading Evidence Arcade</h1><div>Six original reading games • Grades 3–5 • No sign-in</div></header><main><div class="panel toolbar"><label for="topic">Reading topic</label><select id="topic"></select><label for="grade">Level</label><select id="grade"><option value="3">Grade 3</option><option value="4">Grade 4</option><option value="5">Grade 5</option></select><button class="secondary" id="home">All six games</button></div><section id="menu"><h2>Ask & Answer Questions with Text Evidence</h2><div class="grid" id="group1"></div><h2>Explicit Details & Inferences</h2><div class="grid" id="group2"></div></section><section id="play" class="panel hidden"><div class="toolbar"><button class="secondary" id="back">← Games</button><strong id="gameName"></strong><span id="score"></span></div><p class="muted" id="directions"></p><h3>Read the passage</h3><div class="passage" id="passage"></div><div id="task"></div><div class="feedback" id="feedback" role="status" aria-live="polite">Read carefully and complete the challenge.</div><div class="toolbar"><button id="check">Check answer</button><button class="secondary" id="next">New challenge ↻</button></div></section></main><script>
'use strict';
const DATA={
'Vikings':{sentences:['Viking ships were long and narrow, allowing sailors to travel across seas and up some rivers.','Their shallow bottoms helped the ships move through water that was not very deep.','Viking crews used both sails and oars to power their journeys.','Because their ships could travel on different waterways, Vikings reached many distant communities.'],question:'Why could Viking ships travel on some shallow rivers?',answer:'Their shallow bottoms helped them move through water that was not very deep.',evidence:1,inference:'Viking shipbuilders designed vessels for more than one kind of journey.',clues:[0,1,2],weak:'All Viking journeys were easy.'},
'Ancient Rome':{sentences:['Romans built roads to connect cities and distant parts of their empire.','Some roads were made with several layers of materials to create a firm surface.','Soldiers, merchants, and messengers traveled along these routes.','The roads helped people and goods move between communities.'],question:'Who traveled on Roman roads?',answer:'Soldiers, merchants, and messengers.',evidence:2,inference:'Roman roads supported communication and trade.',clues:[0,2,3],weak:'Every Roman road was built in one day.'},
'Waves & Motion':{sentences:['A wave transfers energy from one place to another.','When a pebble falls into a still pond, ripples spread outward from where it lands.','The water at the surface mainly moves up and down as the ripples pass.','The ripple pattern travels across the pond even though the water does not travel all the way across with it.'],question:'What happens after a pebble falls into a still pond?',answer:'Ripples spread outward from where it lands.',evidence:1,inference:'A wave can carry energy without carrying the same water across the entire pond.',clues:[0,2,3],weak:'The pebble makes all the pond water disappear.'},
'Geology':{sentences:['Sedimentary rock can form when layers of sediment build up over time.','New layers press down on older layers beneath them.','Minerals in water may help cement the sediment particles together.','Some sedimentary rocks preserve fossils of organisms that lived long ago.'],question:'What may help cement sediment particles together?',answer:'Minerals in water.',evidence:2,inference:'Some rocks contain clues about environments from long ago.',clues:[0,3],weak:'Every rock contains a dinosaur fossil.'},
'Treasure Island & Adventure':{sentences:['Mara unfolded the worn map and studied the mark beside the rocky shore.','She checked the compass twice before choosing the narrow path.','Dark clouds gathered, but she packed a lantern and an extra coat.','She told her friends they should return before nightfall.'],question:'What did Mara check twice?',answer:'The compass.',evidence:1,inference:'Mara is cautious and plans ahead.',clues:[1,2,3],weak:'Mara knows the treasure is made of gold.'},
'Renaissance & Innovation':{sentences:['During the Renaissance, many artists studied the human body and the natural world.','They made careful sketches to record what they observed.','Some thinkers combined art, mathematics, and engineering in their work.','Sharing drawings and written ideas helped others learn from their discoveries.'],question:'What did artists make to record their observations?',answer:'Careful sketches.',evidence:1,inference:'Careful observation helped people develop and share new ideas.',clues:[0,1,3],weak:'Every Renaissance artist invented a flying machine.'},
'Matter & Interactions':{sentences:['A student mixed sand and water in a clear jar.','After the jar sat still, much of the sand settled at the bottom.','The student carefully poured the water into another container.','Some sand remained in the original jar, showing that the materials could be separated by a physical process.'],question:'Where did much of the sand settle?',answer:'At the bottom of the jar.',evidence:1,inference:'Sand and water can be separated without creating a new substance.',clues:[1,2,3],weak:'The sand turned into a gas.'}
};
const GAMES=[['Question Quest','Create and answer a question that can be proved with the text.','quest'],['Evidence Treasure Hunt','Find the sentence that proves an answer.','hunt'],['Answer on Trial','Choose the strongest text-supported answer.','trial'],['Iceberg Investigator','Sort explicit statements and inferences.','iceberg'],['Inference Detective','Find clues and make a supported inference.','detective'],['Evidence Builder','Build an answer with evidence and reasoning.','builder']];
const $=id=>document.getElementById(id);let game='',round=0,score=0,selected=-1,current=null;
$('topic').innerHTML=Object.keys(DATA).map(k=>`<option>${k}</option>`).join('');
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
GAMES.forEach((g,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<strong>${safe(g[0])}</strong><p>${safe(g[1])}</p>`;b.onclick=()=>start(g[2]);$(i<3?'group1':'group2').append(b)});
function home(){$('menu').classList.remove('hidden');$('play').classList.add('hidden')};$('home').onclick=home;$('back').onclick=home;
function start(m){game=m;round=0;score=0;$('menu').classList.add('hidden');$('play').classList.remove('hidden');$('gameName').textContent=GAMES.find(g=>g[2]===m)[0];challenge()}
function options(items){selected=-1;$('task').innerHTML+='<div class="options">'+items.map((v,i)=>`<button data-n="${i}">${safe(v)}</button>`).join('')+'</div>';$('task').querySelectorAll('.options button').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;$('task').querySelectorAll('.options button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}
function challenge(){round++;current=DATA[$('topic').value];$('score').textContent=`Round ${round} · Score ${score}`;$('feedback').textContent='Read carefully and complete the challenge.';$('passage').innerHTML=current.sentences.map((s,i)=>`<div class="sentence"><strong>[${i+1}]</strong> ${safe(s)}</div>`).join('');$('task').innerHTML='';$('check').disabled=false;const q=current;
if(game==='quest'){$('directions').textContent='Ask an answerable question about the passage. Then answer it and cite a numbered sentence.';$('task').innerHTML='<h3>Write your own text-based question</h3><textarea id="studentQuestion" placeholder="What, why, or how...? "></textarea><h3>Answer your question and cite a sentence number</h3><textarea id="studentAnswer" placeholder="According to sentence __, ..."></textarea><small>Teacher/self-check: The game checks completion and a sentence reference, not whether the reasoning is factually correct.</small>'}
if(game==='hunt'){$('directions').textContent='Find the strongest evidence for the question.';$('task').innerHTML=`<h3>${safe(q.question)}</h3><p>Which sentence provides the answer?</p>`;options(q.sentences.map((s,i)=>`Sentence ${i+1}: ${s}`))}
if(game==='trial'){$('directions').textContent='Choose the answer most strongly supported by the text.';$('task').innerHTML=`<h3>${safe(q.question)}</h3>`;const items=[q.answer,q.weak,'The text does not mention this topic at all.'];const rotated=round%3;const order=[...items.slice(rotated),...items.slice(0,rotated)];current._correct=order.indexOf(q.answer);options(order)}
if(game==='iceberg'){const infer=round%2===0;current._infer=infer;$('directions').textContent='Is the statement directly stated, or inferred from clues?';$('task').innerHTML=`<h3>${safe(infer?q.inference:q.sentences[q.evidence])}</h3>`;options(['Explicit — stated directly','Inference — figured out from details'])}
if(game==='detective'){$('directions').textContent='Use two or more text clues to explain a reasonable inference.';$('task').innerHTML=`<h3>Possible inference: ${safe(q.inference)}</h3><p>Select the sentence that best supports this inference.</p>`;options(q.sentences.map((s,i)=>`Sentence ${i+1}: ${s}`));$('task').insertAdjacentHTML('beforeend','<label for="reason">Explain how the clue supports the inference</label><textarea id="reason" placeholder="This detail suggests ... because ..."></textarea>')}
if(game==='builder'){$('directions').textContent='Build a response with answer, evidence, and reasoning.';$('task').innerHTML=`<h3>${safe(q.question)}</h3><label for="claim">Answer the question</label><textarea id="claim"></textarea><label for="evidence">Quote or paraphrase a numbered text detail</label><textarea id="evidence" placeholder="In sentence __, ..."></textarea><label for="reason">Explain how the evidence supports your answer</label><textarea id="reason" placeholder="This proves my answer because ..."></textarea><small>Teacher/self-check: Writing is checked for completion, not factual accuracy.</small>`}}
$('topic').onchange=()=>{if(game)challenge()};$('grade').onchange=()=>{if(game)challenge()};
$('check').onclick=()=>{let ok=false,msg='',q=current;const val=id=>$(id)?.value.trim()||'';if(game==='quest'){ok=val('studentQuestion').length>=12&&val('studentAnswer').length>=25&&/\b(?:sentence|paragraph|line)\s*\d+\b|\[\d+\]/i.test(val('studentAnswer'));msg=ok?'You included a question, an answer, and a text reference. Now verify the evidence really supports your answer.':'Write a question, a developed answer, and an explicit sentence reference (for example, sentence 2).'}if(game==='hunt'){ok=selected===q.evidence;msg=ok?'Correct! Sentence '+(q.evidence+1)+' contains the evidence.':'Look again. The strongest evidence is sentence '+(q.evidence+1)+'.'}if(game==='trial'){ok=selected===q._correct;msg=ok?'Correct! The best answer is supported by sentence '+(q.evidence+1)+'.':'The supported answer is: '+q.answer+' (sentence '+(q.evidence+1)+').'}if(game==='iceberg'){ok=selected===(q._infer?1:0);msg=ok?'Correct! '+(q._infer?'This conclusion requires combining details.':'This information is stated in the passage.'):'Try again: '+(q._infer?'the author suggests this through clues.':'the author states this directly.')}if(game==='detective'){ok=q.clues.includes(selected)&&val('reason').length>=20;msg=ok?'Good evidence choice and explanation! Check whether your reasoning actually connects the clue to the inference.':'Choose a relevant clue and explain the connection in at least one complete sentence. Suggested clue: sentence '+(q.clues[0]+1)+'.'}if(game==='builder'){ok=val('claim').length>=10&&val('evidence').length>=15&&val('reason').length>=20&&/\b(?:sentence|paragraph|line)\s*\d+\b|\[\d+\]/i.test(val('evidence'));msg=ok?'All three parts are present! Reread to confirm the evidence and reasoning are accurate.':'Include a complete answer, a numbered text detail, and reasoning explaining how the evidence supports your answer.'}if(ok){score+=10;$('check').disabled=true}$('feedback').textContent=(ok?'✓ ':'↻ ')+msg;$('score').textContent=`Round ${round} · Score ${score}`};$('next').onclick=challenge;
const requested=new URLSearchParams(location.search).get('game');if(GAMES.some(g=>g[2]===requested))start(requested);
</script></body></html>
